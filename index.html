<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fog Is Coming // Loading</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #080808;
            color: #d0d0d0;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        .container {
            width: 600px;
            text-align: center;
            border: 1px solid #331010;
            background: rgba(12, 12, 12, 0.9);
            padding: 40px;
            box-shadow: 0 0 20px rgba(100, 10, 10, 0.2);
            position: relative;
        }

        h1 {
            color: #b32424;
            font-size: 20px;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .status {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
            min-height: 20px;
        }

        .tip-box {
            font-size: 15px;
            color: #ccc;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px dashed #222;
            border-bottom: 1px dashed #222;
            padding: 15px 0;
            margin-bottom: 25px;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }

        .fade {
            opacity: 0;
        }

        .loader-bar {
            width: 100%;
            height: 4px;
            background: #1a1a1a;
            position: relative;
            overflow: hidden;
        }

        .loader-progress {
            position: absolute;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #b32424;
            animation: indeterminate 2s infinite linear;
        }

        @keyframes indeterminate {
            0% { left: -100%; right: 100%; }
            50% { left: 30%; right: -30%; }
            100% { left: 100%; right: -100%; }
        }

        .footer-info {
            font-size: 11px;
            color: #555;
            margin-top: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SECTOR 4 // QUARANTINED</h1>
        <div class="status" id="status-text">Инициализация соединения с сервером...</div>
        
        <div class="tip-box" id="tip-container">
            Загрузка данных окружающей среды...
        </div>

        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>

        <div class="footer-info">THE FOG IS COMING // DO NOT TRUST THE MIMICS</div>
    </div>

    <script>
        const tips = [
            "Слушайте окружение. Не каждый звук в соседней комнате — это эхо.",
            "Используйте клавишу [F4], чтобы открыть систему крафта и собрать снаряжение.",
            "Туман прибывает. Если вы видите красную тревогу на горизонте — держитесь укрытий.",
            "Некоторые обитатели этого места способны точно повторять человеческие слова.",
            "Пространственный голосовой чат работает на ограниченной дистанции.",
            "Если вы чувствуете внезапное чувство тревоги — возможно, вы не одни в здании.",
            "Ресурсы ограничены. Каждая банка химикатов или кусок металла на счету."
        ];

        let currentTip = 0;
        const tipElement = document.getElementById('tip-container');

        function changeTip() {
            tipElement.classList.add('fade');
            setTimeout(() => {
                currentTip = (currentTip + 1) % tips.length;
                tipElement.innerText = tips[currentTip];
                tipElement.classList.remove('fade');
            }, 500);
        }

        setInterval(changeTip, 4500);

        function DownloadingFile(fileName) {
            document.getElementById('status-text').innerText = "Загрузка файла: " + fileName;
        }

        function SetStatusChanged(status) {
            document.getElementById('status-text').innerText = status;
        }
    </script>
</body>
</html>
